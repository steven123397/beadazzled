[package]
name = "beadazzled"
version = "0.1.0"
description = "Windows desktop frontend for beads"
authors = ["Steven Liang"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "beadazzled_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10.1.0", features = ["no-serde-warnings"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"
