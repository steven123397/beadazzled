name: CI

# Branch protection: require the "Quality gates (Windows)" check on main.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: pwsh

jobs:
  frontend:
    name: Frontend and browser (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # gitleaks scans the full history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Show Node.js versions
        run: |
          node --version
          npm --version

      - name: Install pinned external tools
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $tools = Join-Path $env:RUNNER_TEMP 'beadazzled-tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null

          $gitleaksZip = Join-Path $tools 'gitleaks.zip'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' `
            -OutFile $gitleaksZip
          $gitleaksHash = (Get-FileHash -Algorithm SHA256 -Path $gitleaksZip).Hash.ToLowerInvariant()
          if ($gitleaksHash -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') {
            throw "gitleaks checksum mismatch: $gitleaksHash"
          }
          Expand-Archive -Path $gitleaksZip -DestinationPath $tools -Force
          $gitleaksExe = Join-Path $tools 'gitleaks.exe'
          if (-not (Test-Path $gitleaksExe)) {
            throw "gitleaks.exe was not extracted"
          }

          $osvScanner = Join-Path $tools 'osv-scanner.exe'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_windows_amd64.exe' `
            -OutFile $osvScanner
          $osvHash = (Get-FileHash -Algorithm SHA256 -Path $osvScanner).Hash.ToLowerInvariant()
          if ($osvHash -ne '9964ed64ec9a387391eb4cc006ad5c531154821aef29b793e02c448de4686438') {
            throw "osv-scanner checksum mismatch: $osvHash"
          }

          "GITLEAKS_PATH=$gitleaksExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OSV_SCANNER_PATH=$osvScanner" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify external tools
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:GITLEAKS_PATH version
          & $env:OSV_SCANNER_PATH --version

      - name: Install npm dependencies
        run: npm ci

      - name: Fast checks
        run: npm run check:fast

      # endOfLine=auto (ADR-0013) keeps this reproducible on Windows CRLF
      # worktrees and LF checkouts alike.
      - name: Format check
        run: npm run format:check

      - name: Frontend build
        run: npm run build

      # The seam must stay out of the bundle and the first screen must stay
      # inside its budget; both read the built assets, which only exist here.
      - name: Bundle checks
        run: npm run check:bundle

      - name: Architecture boundaries
        run: npm run check:boundaries

      - name: Script quality tests
        run: npm run test:quality

      - name: Frontend unit tests
        run: npm run test:unit

      # The browser suite starts Vite's dev server with a fake bridge. It is
      # independent of e2e:real, which remains local release evidence.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Browser end-to-end
        run: npm run e2e

      - name: Dependency audit
        run: npm run check:deps

  rust:
    name: Rust and bridge (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # These scripts use Node's built-in modules and cargo only; no npm ci.
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Show Rust versions
        run: |
          rustc --version
          cargo --version

      - name: Add Rust components
        run: rustup component add rustfmt clippy llvm-tools-preview

      - name: Restore cargo-llvm-cov
        id: llvm-cov-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov.exe
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-llvm-cov-0.9.1

      - name: Install cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Verify cargo-llvm-cov
        run: cargo llvm-cov --version

      # export_bindings rewrites src/bindings/bd.ts during cargo test, so the
      # drift check must run before any later cargo test in this workspace.
      - name: Bindings drift
        run: npm run check:bindings

      - name: Rust formatting and lints
        run: npm run check:rust:style

      - name: Bridge coverage
        run: npm run test:rust:coverage

  quality:
    name: Quality gates (Windows)
    needs: [frontend, rust]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Require all parallel gates
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          $results = @{
            frontend = $env:FRONTEND_RESULT
            rust = $env:RUST_RESULT
          }
          $failed = @($results.GetEnumerator() | Where-Object { $_.Value -ne 'success' })
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object {
              [Console]::Error.WriteLine("$($_.Key) gate is $($_.Value)")
            }
            exit 1
          }
          Write-Output 'frontend and Rust gates passed'
